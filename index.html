.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}

.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bars i{width:70%;max-width:36px;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px;transition:height .35s}.bars i.n{background:var(--bad)}.bars span{font-size:11px;color:var(--mu)}
.w{overflow:auto;max-height:calc(100vh - 170px);background:var(--card);border:1px solid var(--ln);border-radius:12px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1350px;font-variant-numeric:tabular-nums}
th,td{padding:0;border-bottom:1px solid var(--ln);white-space:nowrap}
thead th{position:sticky;top:0;background:var(--card);z-index:3;padding:9px 8px;text-align:right;font-size:12px;color:var(--mu)}
thead th:first-child{left:0;z-index:4;text-align:left}
tbody th{position:sticky;left:0;background:var(--card);z-index:2;text-align:left;font-weight:500;padding:6px 10px;min-width:270px;max-width:270px;overflow:hidden;text-overflow:ellipsis}
td{text-align:right;min-width:92px}td.c{padding:6px 8px}
td:last-child{font-weight:600;border-left:1px solid var(--ln)}
td input{width:100%;border:0;background:transparent;color:inherit;text-align:right;padding:6px 8px;font:inherit;outline:0}
td input:hover{background:var(--inp)}td input:focus{background:var(--inp);box-shadow:inset 0 0 0 2px var(--ac);border-radius:4px}
.nm{width:210px;border:0;background:transparent;color:inherit;font:inherit;outline:0}.nm:focus{box-shadow:inset 0 -2px var(--ac)}
.x{color:var(--mu);cursor:pointer;margin-left:6px;font-style:normal}.x:hover{color:var(--bad)}
tr.t th,tr.t td{font-weight:700;background:var(--gh)}tr.h th,tr.h td{font-weight:600}
tr.s th{padding-left:28px;color:var(--mu)}tr.s td{color:var(--mu)}
tr.gh th,tr.gh td{background:var(--gh);font-weight:600;cursor:pointer}
.closed tr.l{display:none}.add{color:var(--ac);padding:2px 6px;font-size:12px}
.neg{color:var(--bad)}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
small{display:block;color:var(--mu);font-size:11px;font-weight:400}
.hl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.hl section{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}.hl h3{margin:0 0 8px;font:600 16px ui-serif,Georgia,serif}
.hl label{display:block;font-size:12px;color:var(--mu);margin-bottom:6px}.hl textarea{width:100%;margin-top:2px;border:1px solid var(--ln);border-left:4px solid var(--bad);border-radius:8px;background:var(--inp);color:var(--fg);padding:6px 8px;font:inherit;resize:vertical}
.hl .gd textarea{border-left-color:var(--ok)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

c('livc','Livros comprados (R$)'),c('livv','Livros vendidos (R$)'),c('razao','Vendidos / comprados','%','',['>',1,'> 100%']),c('ticket','Ticket médio','$','',['>',300,'> R$ 300']),
i('il','Inadimplentes (last day)','n'),c('pil','Inadimplência last day','%','s',['<',.1,'< 10%']),i('ic','Inadimplentes (current)','n'),c('pic','Inadimplência current','%','s',['<',.05,'< 5%']),
i('tur','Turmas ativas','n'),c('mturma','Média de alunos por turma','d','',['>',6,'> 6']),i('bon','Livros bonificados','n'),i('bol','Bolsistas / permutas','n'),c('pbol','Bolsistas / ativos','%','s')]};
const TABS=[['dre','DRE'],['rec','Receitas'],['desp','Despesas'],['pes','Pessoal'],['inv','Investimentos'],['pre','Pré-operacionais'],['fx','Fluxo de Caixa'],['ind','Indicadores'],['hl','Highlights']];

/* ---------- render ---------- */
const cell=(k,m,f,x='')=>`<td class="c" data-k="${k}" data-m="${m}" data-f="${f}"${x}></td>`;
const cr=(r,T)=>`<tr class="${r.s}"><th>${r.l}${r.t?`<small>meta ${r.t[2]}</small>`:''}</th>${MO.map((_,m)=>cell(r.k,m,r.f,r.t?` data-o="${r.t[0]}" data-v="${r.t[1]}"`:'')).join('')}${T?cell(r.k,12,r.f):''}</tr>`;
const ir=(r,T)=>`<tr><th>${r.l}</th>${MO.map((_,m)=>r.one&&m?'<td></td>':`<td><input class="v" data-x="${r.i}" data-m="${m}" data-f="${r.f}" value="${disp(D.x[r.i][m],r.f)}"></td>`).join('')}${T?(r.one?'<td></td>':cell('x'+r.i,12,r.f)):''}</tr>`;
function GR(id){const L=D.l[id],open=L.length<=13||L.some(l=>l.v.some(v=>v!==''));
return `<tbody data-g="${id}" class="${open?'':'closed'}"><tr class="gh"><th>${G[id]}</th>${[...Array(13).keys()].map(m=>cell('g'+id,m,'$')).join('')}</tr>`+
L.map((l,n)=>`<tr class="l"><th><input class="nm" data-g="${id}" data-n="${n}" value="${esc(l.n)}">${id=='rec'?'':`<i class="x" data-del="${id}.${n}" title="Remover linha">×</i>`}</th>${l.v.map((v,m)=>`<td><input class="v" data-g="${id}" data-n="${n}" data-m="${m}" data-f="$" value="${disp(v,'$')}"></td>`).join('')}${cell('L'+id+'.'+n,12,'$')}</tr>`).join('')+
`<tr class="l"><th><button class="add" data-add="${id}">+ nova linha</button></th><td colspan="13"></td></tr></tbody>`}
const HL=()=>'<div class="hl">'+MO.map((m,j)=>`<section><h3>${m}</h3>`+['Ocorrência ruim 1','Ocorrência ruim 2','Ocorrência boa 1','Ocorrência boa 2'].map((t,q)=>`<label class="${q<2?'':'gd'}">${t}<textarea rows="2" data-h="${j*4+q}">${esc(D.h[j*4+q])}</textarea></label>`).join('')+'</section>').join('')+'</div>';
function render(){
 $('nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k==tab?'on':''}">${l}</button>`).join('');
 $('un').value=D.u;$('an').value=D.a;document.title='Governança '+D.a+(D.u?' – '+D.u:'');
 $('tgl').style.display=['dre','fx','ind','hl'].includes(tab)?'none':'';
 if(tab=='hl'){$('app').innerHTML=HL();return}
 const T=tab!='ind',ttl=TABS.find(t=>t[0]==tab)[1];
 let h=tab=='dre'?'<div class="k">'+[['Receita','rec','$'],['Resultado do período','res','$'],['Lucratividade','luc','%'],['Lucro após investimentos','lap','$']].map(([l,k,f])=>`<div><span>${l}</span><b data-k="${k}" data-m="12" data-f="${f}"></b></div>`).join('')+'</div><div class="bars" id="bars" title="Resultado do período por mês">'+MO.map(m=>`<div><i></i><span>${m}</span></div>`).join('')+'</div>':'';
 h+=`<div class="w"><table><thead><tr><th>${ttl} ${D.a}</th>${MO.map(m=>`<th>${m}/${String(D.a).slice(-2)}</th>`).join('')}${T?'<th>Total</th>':''}</tr></thead>`+
 SH[tab].map(r=>r.g?GR(r.g):'<tbody>'+(r.k?cr(r,T):ir(r,T))+'</tbody>').join('')+'</table></div>';
 $('app').innerHTML=h;update()}
function bars(){const b=$('bars');if(!b)return;const v=S.res.slice(0,12),mx=Math.max(...v.map(Math.abs),1);
 b.querySelectorAll('i').forEach((e,j)=>{e.style.height=Math.abs(v[j])/mx*70+'px';e.classList.toggle('n',v[j]<0);e.title=MO[j]+': '+fmt(v[j],'$')})}
function update(){calc();document.querySelectorAll('[data-k]').forEach(e=>{const v=S[e.dataset.k][+e.dataset.m]||0;e.textContent=fmt(v,e.dataset.f);e.classList.toggle('neg',v<0);
 const o=e.dataset.o;if(o){const m=+e.dataset.m,on=m<12&&S.rec[m]>0,ok=o=='>'?v>+e.dataset.v:v<+e.dataset.v;e.classList.toggle('ok',on&&ok);e.classList.toggle('bad',on&&!ok)}});bars();save()}

/* ---------- eventos ---------- */
const getRaw=t=>t.dataset.g?D.l[t.dataset.g][+t.dataset.n].v[+t.dataset.m]:D.x[t.dataset.x][+t.dataset.m];
const setRaw=(t,v)=>{if(t.dataset.g)D.l[t.dataset.g][+t.dataset.n].v[+t.dataset.m]=v;else D.x[t.dataset.x][+t.dataset.m]=v};
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.h!=null){D.h[+t.dataset.h]=t.value;save()}
 else if(t.classList.contains('nm')){D.l[t.dataset.g][+t.dataset.n].n=t.value;save()}
 else if(t.classList.contains('v')){setRaw(t,t.value);update()}});
document.addEventListener('focusin',e=>{const t=e.target;if(t.classList.contains('v')){t.value=getRaw(t);t.select()}});
document.addEventListener('focusout',e=>{const t=e.target;if(t.classList.contains('v'))t.value=disp(getRaw(t),t.dataset.f)});
document.addEventListener('keydown',e=>{const t=e.target;if(!t.classList||!t.classList.contains('v')||!['Enter','ArrowDown','ArrowUp'].includes(e.key))return;
 e.preventDefault();const l=[...t.closest('table').querySelectorAll(`input.v[data-m="${t.dataset.m}"]`)].filter(n=>n.offsetParent),j=l.indexOf(t)+(e.key=='ArrowUp'?-1:1);if(l[j])l[j].focus()});
document.addEventListener('click',e=>{const t=e.target;
 if(t.dataset.t){tab=t.dataset.t;location.hash=tab;render();return}
 if(t.dataset.add){const n=prompt('Nome da nova linha:');if(n){D.l[t.dataset.add].push({n,v:Array(12).fill('')});render()}return}
 if(t.dataset.del){const[id,n]=t.dataset.del.split('.');if(confirm('Remover "'+D.l[id][+n].n+'"?')){D.l[id].splice(+n,1);render()}return}
 const gh=t.closest('.gh');if(gh)gh.parentElement.classList.toggle('closed')});
$('tgl').onclick=()=>{const a=[...document.querySelectorAll('tbody[data-g]')],o=a.some(b=>!b.classList.contains('closed'));a.forEach(b=>b.classList.toggle('closed',o));$('tgl').textContent=o?'Expandir tudo':'Recolher tudo'};
$('un').oninput=e=>{D.u=e.target.value;document.title='Governança '+D.a+(D.u?' – '+D.u:'');save()};
$('an').onchange=e=>{D.a=e.target.value||'2026';render()};
$('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='governanca-'+D.a+'.json';a.click()};
$('im').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{init(JSON.parse(r.result));render()}catch(x){alert('Arquivo inválido.')}};r.readAsText(f);e.target.value=''};
$('cl').onclick=()=>{if(confirm('Apagar todos os dados deste navegador?')){localStorage.removeItem(KEY);init();render()}};
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!=tab&&SH[h]||h=='hl'){tab=h;render()}});

let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}
init(saved);if(!SH[tab]&&tab!='hl')tab='dre';render();
</script>
</body>
</html>
