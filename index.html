<style>

body.ro .x,body.ro .add:not([data-open]){display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const XK=['inat','tm','ta','des','frm','mat','aa','ap','lead','il','ic','tur','bon','bol','ativ0','saldo','fxJan'];

function init(o){D=o||{};D.l=D.l||{};for(const id in N)D.l[id]=D.l[id]||N[id].split('|').map(n=>({n,v:Array(12).fill('')}));

 D.l.rec=D.l.rec.filter(l=>!((/callan/i.test(l.n)||!l.n.trim())&&l.v.every(v=>v==='')));
 D.l.rec.forEach(l=>{if(/wise and fun|^livros get it\s*-\s*kids$/i.test(l.n.trim()))l.n='Livros Get It - Kids'})}

/* ---------- números ---------- */

const P=s=>{s=String(s==null?'':s).trim().replace(/^=/,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(/,/g,'.');

const disp=(v,f)=>v===''||v==null?'':fmt(P(v),f),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');

/* ---------- motor de cálculo (as fórmulas da planilha) ---------- */
function calc(){S={};const x=D.x,sum=a=>a.reduce((p,q)=>p+q,0),X=(k,i)=>S[k][i],dv=(a,b)=>b?a/b:0,
def=(k,f,a)=>{const r=[];for(let i=0;i<12;i++)r[i]=f(i);r[12]=a?f(12):sum(r);S[k]=r},

for(const id of Object.keys(N)){const L=D.l[id],K=n=>'L'+id+'.'+n;
 L.forEach((l,n)=>{if(!AUTO(id,l.n)){const v=l.v.map(P);v[12]=sum(v);S[K(n)]=v}});
 L.forEach((l,n)=>{const a=AUTO(id,l.n);if(!a)return;const v=[];const fp=i=>(X('gfun',i)+X('gpro',i))/12;for(let i=0;i<12;i++)
  v[i]=a=='roy'?(X('rec',i)-X('livros',i))*ROY:a=='dec'?fp(i):a=='fer'?fp(i)*1.3:fg(i)*.5;v[12]=sum(v);S[K(n)]=v});

 if(id=='rec'){def('rec',i=>X('grec',i));const m=cs('m'),b=cs('l'),r=cs('r');def('mens',i=>sk(i,m));def('livros',i=>sk(i,b));def('reneg',i=>sk(i,r));
  def('outras',i=>X('rec',i)-X('mens',i)-X('livros',i)-X('reneg',i))}}
def('das',i=>X('gdas',i));def('com',i=>X('gcom',i));def('csp',i=>X('das',i)+X('com',i));

/* ---------- login, perfis e painel do administrador (servidor = Apps Script + planilha do Google) ---------- */
const API_PENDING = new Map();
window.addEventListener('message', e => {
  const d=e.data;
  if(!d || d.type!=='GETIT_API_RESPONSE' || !d.requestId) return;
  const resolve=API_PENDING.get(d.requestId);
  if(resolve){API_PENDING.delete(d.requestId);resolve(d.payload||{ok:false,erro:'Resposta inválida do servidor.'});}
});
async function api(a,p={}){
 if(!API_URL)return{ok:false,erro:'Configure API_URL no início do script.'};
 const requestId=String(Date.now())+'_'+Math.random().toString(36).slice(2);
 return new Promise(resolve=>{
   API_PENDING.set(requestId,resolve);
   const frame=document.getElementById('api-bridge')||document.body.appendChild(Object.assign(document.createElement('iframe'),{id:'api-bridge',name:'api-bridge',style:'display:none'}));
   const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target='api-bridge';form.style.display='none';
   const input=document.createElement('input');input.name='payload';input.value=JSON.stringify({a,t:TOK,requestId,...p});form.appendChild(input);document.body.appendChild(form);
   form.submit();form.remove();
   setTimeout(()=>{if(API_PENDING.has(requestId)){API_PENDING.delete(requestId);resolve({ok:false,erro:'Sem resposta do servidor. Confira a implantação do Apps Script e a URL /exec.'});}},20000);
 });
}

async function load(alvo){const j=await api('load',alvo?{alvo}:{});
 if(!j.ok){alert(j.erro||'Não foi possível carregar os dados.');return false}
 init(j.conteudo&&j.conteudo.l?j.conteudo:null);RO=!!alvo;document.body.classList.toggle('ro',RO);return true}
async function enter(u){
 ME={email:u.email,nome:u.nome||u.email,role:u.role};
 if(!await load())return;
 if(ME.role=='admin'&&!TABS.some(t=>t[0]=='adm'))TABS.push(['adm','Franquias']);
 if(tab=='adm'&&ME.role!='admin'||!SH[tab]&&tab!='hl'&&tab!='adm')tab='dre';

async function renderAdm(){
 $('app').innerHTML=vw()+'<p style="color:var(--mu)">Carregando franquias…</p>';
 const j=await api('painel');if(!j.ok){$('app').innerHTML=vw()+'<p>'+esc(j.erro||'Não foi possível carregar as franquias.')+'</p>';return}
 const tot={rec:0,res:0,lap:0};
 const rows=j.lista.map(p=>{const r=p.resumo||{};tot.rec+=r.rec||0;tot.res+=r.res||0;tot.lap+=r.lap||0;
  const up=p.atualizado?new Date(p.atualizado).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'–';
  return `<tr><th>${esc(p.nome||p.email)}${p.role=='admin'?'<em class="au">admin</em>':''}</th><td class="c">${fmt(r.rec,'$')}</td><td class="c${r.res<0?' neg':''}">${fmt(r.res,'$')}</td><td class="c">${fmt(r.luc,'%')}</td><td class="c">${fmt(r.lap,'$')}</td><td class="c">${up}</td><td><button class="add" data-open="${esc(p.email)}" data-nm="${esc(p.nome||p.email)}">Abrir</button></td></tr>`}).join('');
 $('app').innerHTML=vw()+`<div class="ac" style="margin:0 0 12px"><button id="rf">Atualizar</button></div>
 <div class="w"><table style="min-width:900px"><thead><tr><th>Franquia</th><th>Receita no ano</th><th>Resultado</th><th>Lucratividade</th><th>Lucro após invest.</th><th>Atualizado em</th><th></th></tr></thead>
 <tbody>${rows}<tr class="t"><th>TOTAL — todas as franquias</th><td class="c">${fmt(tot.rec,'$')}</td><td class="c${tot.res<0?' neg':''}">${fmt(tot.res,'$')}</td><td class="c">${fmt(tot.rec?tot.res/tot.rec:0,'%')}</td><td class="c">${fmt(tot.lap,'$')}</td><td></td><td></td></tr></tbody></table></div>`;
 $('rf').onclick=()=>renderAdm()}

/* ---------- entrada ---------- */
async function start(){
 if(!API_URL){showLogin();$('lgm').textContent='Configure API_URL no início do script.';return}
 // Nunca tenta restaurar uma sessão automaticamente após carregar/recarregar a página.
 TOK=null;
 showLogin()}
$('lgf').onsubmit=async e=>{e.preventDefault();const m=$('lgm'),b=$('lgf').querySelector('button');m.textContent='';b.disabled=true;b.textContent='Entrando…';
 const j=await api('login',{email:$('lge').value.trim(),senha:$('lgp').value});b.disabled=false;b.textContent='Entrar';
 if(!j.ok){m.textContent=j.erro||'Não foi possível entrar.';return}
 TOK=j.token;sessionStorage.setItem('gov_tok',TOK);$('lgp').value='';enter(j)};
$('out').onclick=async()=>{await api('logout');sessionStorage.removeItem('gov_tok');location.reload()};
$('pw').onclick=async()=>{const p=prompt('Nova senha (mínimo 6 caracteres):');if(!p)return;const j=await api('senha',{nova:p});alert(j.ok?'Senha alterada.':'Não foi possível trocar a senha: '+(j.erro||''))};
start();
